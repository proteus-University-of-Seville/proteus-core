archetype.prop_name.importance: "Importance"
archetype.prop_name.inherits-from: "Inherits from"
archetype.prop_name.ordered: "Ordered"
archetype.prop_name.participates-in: "Participates in"
archetype.prop_name.place: "Place"
archetype.prop_name.priority: "Priority"
archetype.prop_name.results: "Results"
archetype.prop_name.solution: "Solution"
archetype.prop_name.stability: "Stability"
archetype.prop_name.status: "Status"
archetype.prop_name.time: "Time"
archetype.prop_name.trace-type: "Trace type"
archetype.prop_name.urgency: "Urgency"

